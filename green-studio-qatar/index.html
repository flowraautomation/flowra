<style>
/* Shared engine. Each firm sets its own palette, faces and layout through :root{--bg:#f3f2ed;--bg2:#1d2420;--ink:#1d2420;--ink2:#f3f2ed;--mute:#6b706a;--mute2:#a9b0a6;--line:rgba(29,36,32,.12);--accent:#3f6b4b;--card:#ffffff;--radius:20px;
  --display:Outfit,system-ui,sans-serif;--dispw:500;--dispt:-.02em;--serif2:Outfit,system-ui,sans-serif;--body:"IBM Plex Sans Arabic",system-ui,sans-serif;--ar:"IBM Plex Sans Arabic",Tahoma,sans-serif;--ardisp:Alexandria,"IBM Plex Sans Arabic",sans-serif;
  --ctaink:#ffffff;--navblend:normal;--loaderbg:#1d2420;color-scheme:light}
  .loader{color:#f3f2ed}
  nav{color:#fff} nav .logo img{height:36px;width:auto;transition:filter .4s}
  nav.scrolled .logo img{filter:invert(1) hue-rotate(180deg) saturate(1.3) brightness(.9)}
  body.flip{--accent:#9fc46a} body.flip nav.scrolled{color:var(--ink2);background:color-mix(in srgb,var(--bg2) 88%,transparent)} body.flip nav.scrolled .logo img{filter:none}
  .steps div{background:var(--card)} body.flip .steps div{background:#252e29;border-color:rgba(255,255,255,.08)}
  .stmt em{font-style:normal;color:var(--accent)} [dir=rtl] .disp,[dir=rtl] .stat b{font-weight:700}
  .marq span:nth-child(even){-webkit-text-stroke:1px var(--accent)} below. */
:root{
  --gl:max(16px, env(safe-area-inset-left, 0px), min(4vw, 56px));
  --gr:max(16px, env(safe-area-inset-right, 0px), min(4vw, 56px));
  --ease:cubic-bezier(.22,1,.36,1); --ease-io:cubic-bezier(.65,0,.35,1);
}
:root{--bg:#f3f2ed;--bg2:#1d2420;--ink:#1d2420;--ink2:#f3f2ed;--mute:#6b706a;--mute2:#a9b0a6;--line:rgba(29,36,32,.12);--accent:#3f6b4b;--card:#ffffff;--radius:20px;
  --display:Outfit,system-ui,sans-serif;--dispw:500;--dispt:-.02em;--serif2:Outfit,system-ui,sans-serif;--body:"IBM Plex Sans Arabic",system-ui,sans-serif;--ar:"IBM Plex Sans Arabic",Tahoma,sans-serif;--ardisp:Alexandria,"IBM Plex Sans Arabic",sans-serif;
  --ctaink:#ffffff;--navblend:normal;--loaderbg:#1d2420;color-scheme:light}
  .loader{color:#f3f2ed}
  nav{color:#fff} nav .logo img{height:36px;width:auto;transition:filter .4s}
  nav.scrolled .logo img{filter:invert(1) hue-rotate(180deg) saturate(1.3) brightness(.9)}
  body.flip{--accent:#9fc46a} body.flip nav.scrolled{color:var(--ink2);background:color-mix(in srgb,var(--bg2) 88%,transparent)} body.flip nav.scrolled .logo img{filter:none}
  .steps div{background:var(--card)} body.flip .steps div{background:#252e29;border-color:rgba(255,255,255,.08)}
  .stmt em{font-style:normal;color:var(--accent)} [dir=rtl] .disp,[dir=rtl] .stat b{font-weight:700}
  .marq span:nth-child(even){-webkit-text-stroke:1px var(--accent)}
*{box-sizing:border-box;margin:0;padding:0}
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
body{background:var(--bg);color:var(--ink);font:var(--bodyw,300) 16px/1.6 var(--body);overflow-x:hidden;-webkit-font-smoothing:antialiased;transition:background .8s var(--ease),color .8s var(--ease)}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:1px solid var(--accent);outline-offset:4px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.ar{font-family:var(--ar);direction:rtl}
h1,h2,h3{text-wrap:balance;font-weight:inherit}
.disp{font-family:var(--display);font-weight:var(--dispw,400);letter-spacing:var(--dispt,-.01em);text-transform:var(--dispcase,none)}
.lbl{font-family:var(--mono,var(--body));font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--mute)}
.wrap{padding-left:var(--gl);padding-right:var(--gr)}
section{position:relative}
.pad{padding-top:clamp(88px,12vw,168px);padding-bottom:clamp(88px,12vw,168px)}
body.flip{background:var(--bg2);color:var(--ink2)}
body.flip .lbl{color:var(--mute2)}

/* loader */
.loader{position:fixed;inset:0;z-index:100;background:var(--loaderbg,var(--bg));color:var(--ink);display:flex;align-items:flex-end;justify-content:space-between;padding:40px var(--gr) 40px var(--gl);transition:clip-path 1.2s var(--ease-io)}
.loader.done{clip-path:inset(0 0 100% 0);pointer-events:none}
.loader .num{font-family:var(--display);font-size:clamp(64px,14vw,180px);line-height:.8;font-variant-numeric:tabular-nums}

/* nav */
nav{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:calc(20px + env(safe-area-inset-top, 0px)) var(--gr) 20px var(--gl);mix-blend-mode:var(--navblend,difference);color:#fff}
nav .logo{font-family:var(--display);font-size:18px;letter-spacing:.06em}
nav ul{display:flex;gap:28px;list-style:none;font-size:12px;letter-spacing:.16em;text-transform:uppercase}
nav ul a{position:relative}
nav ul a::after{content:"";position:absolute;left:0;bottom:-4px;height:1px;width:100%;background:currentColor;transform:scaleX(0);transform-origin:right;transition:transform .5s var(--ease)}
nav ul a:hover::after{transform:scaleX(1);transform-origin:left}

/* shared photo plate with 3D strip flip */
.plate{position:absolute;inset:0;overflow:hidden;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(1.06)}
.plate .kb{position:absolute;inset:0;animation:kb 14s ease-in-out infinite alternate}
.plate .img{position:absolute;inset:-6%;background-size:cover;background-position:center;filter:var(--imgfilter,none);transform:translate3d(var(--px,0),var(--py,0),0)}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.12) translate3d(-2%,-1.5%,0)}}
.strips{position:absolute;inset:0;display:flex;perspective:1800px;pointer-events:none;z-index:1}
.strip{position:relative;flex:1;overflow:hidden;transform-origin:left center;transform:rotateY(-100deg);opacity:0;backface-visibility:hidden}
.strip.go{animation:flip 1.25s var(--ease) forwards}
.strip i{position:absolute;top:-6%;bottom:-6%;background-size:cover;background-position:center;filter:var(--imgfilter,none)}
@keyframes flip{0%{transform:rotateY(-100deg);opacity:0;filter:brightness(2)}35%{opacity:1}100%{transform:rotateY(0);opacity:1;filter:brightness(1)}}
.intro3d{transform:rotateX(16deg) scale(1.18) translateY(4%);filter:blur(12px) brightness(.5);transition:transform 3s var(--ease),filter 2.2s var(--ease)}
.ready .intro3d{transform:none;filter:none}
.rise .w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.08em}
.rise .w>span{display:inline-block;transform:translateY(108%);transition:transform 1.4s var(--ease)}
.ready .rise .w>span{transform:none}
.fadeup{opacity:0;transform:translateY(18px);transition:1.2s var(--ease) .8s}
.ready .fadeup{opacity:1;transform:none}

/* hero: arch (palace) */
.h-arch{min-height:100svh;display:grid;grid-template-rows:auto 1fr;justify-items:center;text-align:center;padding-top:calc(110px + env(safe-area-inset-top,0px));perspective:1400px}
.h-arch .ttl{font-size:clamp(46px,8vw,128px);line-height:.95}
.h-arch .ttl-ar{font-size:clamp(26px,3.6vw,52px);line-height:1.5;color:var(--accent);margin-top:6px}
.h-arch .arch{position:relative;width:min(560px,78vw);aspect-ratio:3/4;margin-top:36px;border-radius:999px 999px 0 0;overflow:hidden;box-shadow:0 0 0 1px var(--accent),0 0 0 14px var(--bg),0 0 0 15px color-mix(in srgb,var(--accent) 45%,transparent)}
.h-arch .side{position:absolute;top:48%;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--mute);writing-mode:vertical-rl}
.h-arch .side.l{left:var(--gl)} .h-arch .side.r{right:var(--gr)}

/* hero: card (full photo + floating card) */
.h-card{height:100svh;position:relative;overflow:hidden;perspective:1400px}
.h-card .plate{inset:0}
.h-card .veil{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(15,18,16,.45),transparent 30%,transparent 55%,rgba(15,18,16,.55))}
.h-card .card2{position:absolute;z-index:3;inset-inline-end:var(--gr);bottom:calc(64px + env(safe-area-inset-bottom,0px));width:min(600px,calc(100% - var(--gl) - var(--gr)));background:var(--bg);color:var(--ink);border-radius:var(--radius,20px);padding:36px 36px 30px;box-shadow:0 40px 90px -30px rgba(0,0,0,.55);opacity:0;transform:translateY(40px);transition:all 1.3s var(--ease) 1s}
.ready .h-card .card2{opacity:1;transform:none}
.h-card h1{font-size:clamp(40px,4.6vw,72px);line-height:1.05;margin:14px 0 14px}
.h-card p{color:var(--mute);max-width:46ch}
.h-card .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.h-card .btns a{padding:13px 20px;border-radius:999px;font-size:14px;border:1px solid var(--line)}
.h-card .btns a.p{background:var(--accent);color:var(--ctaink,#fff);border-color:var(--accent)}
.h-card .mini{display:flex;gap:28px;margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
.h-card .mini b{display:block;font-family:var(--display);font-size:30px;line-height:1;color:var(--accent)}
.h-card .mini span{font-size:12px;color:var(--mute)}
[dir=rtl] .h-card .mini b{font-family:var(--ardisp,var(--ar))}
nav.scrolled{background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);mix-blend-mode:normal;color:var(--ink)}
nav{transition:background .4s,color .4s}

/* villa build (scroll-driven, reel style) */
.vb{position:relative;height:620vh}
.vb .pin{position:sticky;top:0;height:100svh;overflow:hidden;background:radial-gradient(130% 100% at 50% 32%,color-mix(in srgb,var(--bg) 60%,#fff) 0%,var(--bg) 58%,color-mix(in srgb,var(--bg) 92%,#000) 100%)}
.vb .stg{position:absolute;inset:0;display:grid;place-items:center}
.vb svg{width:min(66vw,1080px);max-height:78svh;height:auto;display:block;will-change:transform}
.vb .lst{position:absolute;z-index:3;top:clamp(96px,15vh,150px);inset-inline-start:var(--gl);display:flex;flex-direction:column;gap:clamp(7px,1.3vh,13px);margin:0;padding:0}
.vb .lst li{list-style:none;display:flex;align-items:center;gap:11px;opacity:.45;transition:opacity .55s}
.vb .lst .d{width:5px;height:5px;border-radius:50%;background:var(--mute);transition:background .55s,transform .55s;transform:scale(.8)}
.vb .lst .t{font-size:clamp(12px,1.4vw,14.5px)}
.vb .lst li.on{opacity:1}.vb .lst li.on .d{background:var(--accent);transform:scale(1.3)}.vb .lst li.on .t{font-weight:500}
.vb .wd{position:absolute;z-index:3;inset-inline-start:var(--gl);top:54%;transform:translateY(-50%);max-width:min(40vw,420px);pointer-events:none}
.vb .wd .n{font-family:var(--display);font-size:14px;letter-spacing:.2em;color:var(--accent);display:block;margin-bottom:8px;transition:opacity .45s}
.vb .wd h2{font-family:var(--display);font-weight:var(--dispw,400);margin:0;font-size:clamp(38px,5.6vw,80px);line-height:1.02;white-space:nowrap;transition:opacity .45s}
[dir=rtl] .vb .wd h2{font-family:var(--ardisp,var(--ar));font-weight:700}
.vb .wd .s{display:block;margin-top:14px;font-size:clamp(13px,1.5vw,16px);color:var(--mute);transition:opacity .45s}
.vb .bar{position:absolute;z-index:3;left:0;right:0;bottom:0;height:2px;background:var(--line)}
.vb .bar i{position:absolute;inset:0 auto 0 0;width:0;background:var(--accent)}
.vb .hint{position:absolute;z-index:3;bottom:28px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:.24em;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:7px;transition:opacity .4s}
.vb .hint i{width:1px;height:24px;background:var(--mute);animation:vbdrop 1.9s ease-in-out infinite;transform-origin:top}
@keyframes vbdrop{0%{transform:scaleY(0);opacity:0}30%{opacity:1}100%{transform:scaleY(1);opacity:0}}
@media (max-width:820px){ .vb svg{width:118vw;margin-top:-6vh} .vb .wd{inset-inline:0;max-width:100%;text-align:center;top:auto;bottom:clamp(64px,12vh,110px);transform:none} .vb .wd h2{font-size:clamp(34px,11vw,56px)} .vb .lst{top:84px} }
/* hero: split (swiss) */
.h-split{min-height:100svh;display:grid;grid-template-columns:1fr 1fr;padding-top:calc(90px + env(safe-area-inset-top,0px));perspective:1400px}
.h-split .txt{display:flex;flex-direction:column;justify-content:space-between;padding:24px var(--gl) 0 var(--gl);gap:40px}
.h-split .txt p.big{font-size:clamp(26px,2.6vw,40px);line-height:1.15;max-width:18ch}
.h-split .pic{position:relative;margin:0 var(--gr) 0 0;min-height:70svh}
.h-split .mark{grid-column:1/-1;font-size:clamp(90px,22vw,360px);line-height:.78;padding:0 var(--gr) 0 var(--gl);margin-top:-.08em;white-space:nowrap;overflow:hidden}

/* hero: blueprint (engineering) */
.h-blue{height:100svh;position:relative;overflow:hidden;perspective:1400px}
.h-blue .grid{position:absolute;inset:0;z-index:2;pointer-events:none;background-image:linear-gradient(var(--gridc) 1px,transparent 1px),linear-gradient(90deg,var(--gridc) 1px,transparent 1px);background-size:64px 64px}
.h-blue .shade{position:absolute;inset:0;z-index:2;background:linear-gradient(90deg,var(--bg) 0%,color-mix(in srgb,var(--bg) 70%,transparent) 45%,transparent 75%)}
.h-blue .cx,.h-blue .cy{position:absolute;z-index:3;background:var(--accent);opacity:.55;pointer-events:none}
.h-blue .cx{left:0;right:0;height:1px} .h-blue .cy{top:0;bottom:0;width:1px}
.h-blue .coord{position:absolute;z-index:3;font-family:var(--mono);font-size:11px;color:var(--accent);transform:translate(12px,12px);white-space:nowrap}
.h-blue .copy{position:absolute;z-index:4;left:var(--gl);right:var(--gr);bottom:max(72px,10vh)}
.h-blue h1{font-size:clamp(54px,9vw,150px);line-height:.88;max-width:12ch}
.h-blue .row{display:flex;gap:16px 48px;flex-wrap:wrap;margin-top:28px;align-items:flex-end}
.h-blue .row p{max-width:42ch;color:var(--mute)}

/* hero: type (brutalist) */
.h-type{min-height:100svh;padding-top:calc(96px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;justify-content:center;overflow:hidden;position:relative}
.h-type .line{font-size:clamp(70px,17vw,300px);line-height:.82;white-space:nowrap;padding:0 var(--gr) 0 var(--gl)}
.h-type .line.o{color:transparent;-webkit-text-stroke:1.5px var(--ink)}
.h-type .win{position:relative;height:clamp(140px,26vh,280px);margin:12px var(--gr) 12px var(--gl);overflow:hidden;clip-path:inset(0 var(--wi,30%) 0 var(--wi,30%));transition:clip-path .2s linear}
.h-type .meta{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:24px var(--gr) 0 var(--gl)}

/* hero: bilingual (family) */
.h-bi{min-height:100svh;padding-top:calc(104px + env(safe-area-inset-top,0px));display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr;gap:0 4vw;perspective:1400px}
.h-bi .en{padding-left:var(--gl)} .h-bi .arr{padding-right:var(--gr);text-align:right}
.h-bi h1{font-size:clamp(40px,6.2vw,104px);line-height:.95}
.h-bi .arr h1{font-family:var(--ar);line-height:1.35;font-size:clamp(34px,5vw,84px)}
.h-bi p{margin-top:18px;max-width:40ch;color:var(--mute)} .h-bi .arr p{margin-left:auto}
.h-bi .pic{grid-column:1/-1;position:relative;margin:40px var(--gr) 0 var(--gl);min-height:46svh;border-radius:var(--radius,0)}
.h-bi .badge{position:absolute;z-index:3;right:24px;top:24px;background:var(--bg);color:var(--ink);padding:14px 18px;border-radius:999px;font-size:13px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.15)}
.h-bi .badge b{font-family:var(--display);font-size:22px;color:var(--accent)}

/* hero: collage (avant-garde) */
.h-col{height:100svh;position:relative;overflow:hidden}
.h-col .word{position:absolute;left:var(--gl);right:var(--gr);top:50%;transform:translateY(-50%);font-size:clamp(110px,27vw,460px);line-height:.8;z-index:2;mix-blend-mode:var(--wordblend,normal);pointer-events:none}
.h-col .fl{position:absolute;overflow:hidden;box-shadow:0 30px 70px -20px rgba(0,0,0,.6);transform:translate3d(var(--fx,0),var(--fy,0),0) rotate(var(--fr,0deg))}
.h-col .fl .img{position:absolute;inset:-8%;background-size:cover;background-position:center}
.h-col .f1{width:min(30vw,420px);aspect-ratio:3/4;left:8vw;top:14vh;z-index:1}
.h-col .f2{width:min(34vw,500px);aspect-ratio:4/3;right:7vw;top:22vh;z-index:3}
.h-col .f3{width:min(20vw,280px);aspect-ratio:1;left:42vw;bottom:9vh;z-index:3}
.h-col .man{position:absolute;z-index:4;left:var(--gl);bottom:calc(60px + env(safe-area-inset-bottom,0px));max-width:34ch;font-size:15px}
.h-col .man em{font-family:var(--serif2);font-size:1.5em;font-style:italic;color:var(--accent)}

/* marquee */
.marq{overflow:hidden;white-space:nowrap;padding:22px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.marq .tr{display:inline-flex;gap:0;will-change:transform}
.marq span{font-size:clamp(44px,8vw,130px);line-height:1;padding-right:.5em}
.marq span:nth-child(even){color:transparent;-webkit-text-stroke:1px var(--accent)}
.marq span i{font-style:normal;color:var(--accent);padding:0 .3em}

/* statement + stats */
.stmt{font-size:clamp(30px,4.4vw,66px);line-height:1.1;max-width:24ch}
.stmt em{color:var(--accent);font-style:italic;font-family:var(--serif2,var(--display))}
.rl{display:block;overflow:hidden}.rl>span{display:block;transform:translateY(40%);opacity:0;transition:transform 1.2s var(--ease),opacity 1.2s var(--ease)}
.in .rl>span{transform:none;opacity:1}
.in .rl:nth-child(2)>span{transition-delay:.08s}.in .rl:nth-child(3)>span{transition-delay:.16s}.in .rl:nth-child(4)>span{transition-delay:.24s}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-top:80px;border-top:1px solid var(--line)}
.stat{padding:26px 0;border-bottom:1px solid var(--line)}
.stat b{display:block;font-family:var(--display);font-weight:var(--dispw,400);font-size:clamp(48px,5.6vw,84px);line-height:1;font-variant-numeric:tabular-nums}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:48px}

/* project index with cursor image */
.idx{list-style:none}
.idx li{display:grid;grid-template-columns:56px 1fr auto;gap:20px;align-items:baseline;padding:18px 0;border-bottom:1px solid var(--line);cursor:pointer;transition:padding .5s var(--ease),color .4s}
.idx li .n{font-family:var(--mono,var(--body));font-size:11px;color:var(--mute)}
.idx li .t{font-family:var(--display);font-weight:var(--dispw,400);font-size:clamp(26px,3.4vw,50px);line-height:1.05;text-transform:var(--dispcase,none)}
.idx li .m{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);text-align:right}
.idx li:hover{padding-left:18px;color:var(--accent)}
.idx.wall{display:flex;flex-wrap:wrap;gap:.1em .5em;border:0}
.idx.wall li{display:inline;border:0;padding:0}
.idx.wall li .n,.idx.wall li .m{display:none}
.idx.wall li .t{font-size:clamp(28px,4.4vw,70px)}
.idx.wall li:nth-child(3n+2) .t{color:transparent;-webkit-text-stroke:1px currentColor}
.idx.wall li:hover{padding-left:0}
.idx.wall li:hover .t{color:var(--accent);-webkit-text-stroke:0}
.peek{position:fixed;z-index:45;left:0;top:0;width:320px;aspect-ratio:4/5;pointer-events:none;overflow:hidden;opacity:0;transform:translate3d(var(--x,0),var(--y,0),0) translate(-50%,-50%) scale(.7) rotate(var(--r,0deg));transition:opacity .35s var(--ease),transform .5s var(--ease)}

/* 3D gallery */
.gal{height:300vh}
.gal .stick{position:sticky;top:0;height:100svh;overflow:hidden;display:flex;flex-direction:column;justify-content:center;perspective:1600px}

.card{flex:0 0 min(60vw,840px);aspect-ratio:16/10;max-width:100%;position:relative;transform-style:preserve-3d;cursor:pointer}
.card .ph{position:absolute;inset:0;overflow:hidden;border-radius:var(--radius,2px);box-shadow:0 40px 80px -30px rgba(0,0,0,.7)}
.card .pi{position:absolute;inset:0 -10%;background-size:cover;background-position:center;filter:var(--imgfilter,none);transform:translate3d(var(--ix,0),0,0) scale(var(--is,1.05))}
.card .ph::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(105deg,transparent 35%,rgba(255,240,220,.22) 50%,transparent 65%);background-size:300% 100%;background-position:var(--cg,50%) 0;mix-blend-mode:screen}
.card .ph::after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,transparent 45%,rgba(8,7,6,.78))}
.card .meta{position:absolute;z-index:2;left:24px;right:24px;bottom:20px;color:#f4efe8;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;transform:translateZ(40px)}
.card h3{font-family:var(--display);font-weight:var(--dispw,400);font-size:clamp(24px,3vw,44px);line-height:1;text-transform:var(--dispcase,none)}
.card .tag{font-size:11px;letter-spacing:.18em;text-transform:uppercase;opacity:.85;white-space:nowrap}
.card .enter{position:absolute;z-index:2;top:16px;right:18px;transform:translateZ(40px);font-size:11px;letter-spacing:.2em;text-transform:uppercase;padding:9px 14px;border:1px solid rgba(244,239,232,.6);border-radius:999px;color:#f4efe8;background:rgba(10,9,8,.35);backdrop-filter:blur(6px);transition:background .4s,color .4s}
.card:hover .enter{background:#f4efe8;color:#111}
.gal .bar{position:absolute;left:var(--gl);right:var(--gr);bottom:calc(56px + env(safe-area-inset-bottom,0px));height:1px;background:var(--line)}
.gal .bar i{position:absolute;inset:0;background:var(--accent);transform-origin:left;transform:scaleX(var(--gp,0))}

/* table (engineering) */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px}
.filters button{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:9px 14px;border:1px solid var(--line);border-radius:999px;color:var(--mute);transition:all .3s}
.filters button.on,.filters button:hover{border-color:var(--accent);color:var(--accent)}
.tbl{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;min-width:720px}
.tbl th{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);text-align:left;font-weight:400;padding:12px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:18px 10px;border-bottom:1px solid var(--line);vertical-align:top}

.tbl tr{transition:background .3s}.tbl tbody tr:hover{background:color-mix(in srgb,var(--accent) 8%,transparent)}

.mats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px}
.mat{aspect-ratio:3/4;position:relative;overflow:hidden;border-radius:999px 999px 0 0;transition:transform .7s var(--ease)}
.mat:hover{transform:translateY(-10px)}

.crafts h4{font-family:var(--display);font-size:24px;margin-bottom:8px;color:var(--accent)}
.crafts p{color:var(--mute);font-size:14.5px}

/* steps (family) */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;counter-reset:s}

.steps b{display:block;font-family:var(--display);font-size:56px;line-height:1;color:var(--accent)}

.plan svg{width:100%;height:auto;display:block}

/* services */
.svc{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}

/* band */
.band{position:relative;height:78svh;overflow:hidden}
.band .img{position:absolute;inset:-12% 0;background-size:cover;background-position:center;filter:var(--imgfilter,none);transform:translate3d(0,var(--by,0),0) scale(1.05)}

/* contact */
.contact h2{font-size:clamp(56px,11vw,180px);line-height:.88}

.cta{display:inline-flex;align-items:center;gap:16px;margin-top:44px;padding:18px 30px;border:1px solid currentColor;border-radius:999px;font-size:13px;letter-spacing:.18em;text-transform:uppercase;position:relative;overflow:hidden;isolation:isolate;transition:color .6s var(--ease)}
.cta::before{content:"";position:absolute;inset:0;background:var(--accent);transform:translateY(101%);transition:transform .6s var(--ease);z-index:-1}
.cta:hover{color:var(--ctaink,#111)}.cta:hover::before{transform:none}
.foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:14px 32px;margin-top:88px;padding:24px 0 48px;border-top:1px solid var(--line);font-size:12.5px;color:var(--mute);user-select:text}
.concept{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(15,14,13,.9);backdrop-filter:blur(10px);font-size:11.5px;letter-spacing:.04em;color:#bdb6ab;padding:8px var(--gr) calc(8px + env(safe-area-inset-bottom,0px)) var(--gl);text-align:center}
.concept b{color:#fff;font-weight:500}
.fade{opacity:0;transform:translateY(24px);transition:1.1s var(--ease)}
.in .fade{opacity:1;transform:none}

/* immersive room */
.room{position:fixed;inset:0;z-index:90;background:#000;color:#f4efe8;opacity:0;pointer-events:none;transition:opacity .7s var(--ease)}
.room.on{opacity:1;pointer-events:auto}
.room canvas{display:block;width:100%;height:100%;cursor:grab}
.room::after{content:"";position:absolute;inset:auto 0 0 0;height:40%;background:linear-gradient(transparent,rgba(0,0,0,.7));pointer-events:none}
.room .hud{position:absolute;z-index:1;left:var(--gl);right:var(--gr);bottom:calc(40px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:flex-end;gap:16px;pointer-events:none}
.room h3{font-family:var(--display);font-size:clamp(34px,5vw,72px);line-height:1;text-transform:var(--dispcase,none)}
.room .hint{font-size:11px;letter-spacing:.24em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.room .hint b{display:inline-block;width:26px;height:26px;border:1px solid currentColor;border-radius:50%;position:relative}
.room .hint b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:currentColor;animation:drag 2.4s var(--ease-io) infinite}
@keyframes drag{0%,100%{transform:translateX(-6px)}50%{transform:translateX(6px)}}
.room .close{position:absolute;z-index:1;top:calc(20px + env(safe-area-inset-top,0px));right:var(--gr);width:48px;height:48px;border-radius:50%;border:1px solid rgba(244,239,232,.5);background:rgba(13,12,11,.4);font-size:20px}
.room .tag{position:absolute;z-index:1;top:calc(32px + env(safe-area-inset-top,0px));left:var(--gl);font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--accent)}

.lang{display:inline-flex;border:1px solid currentColor;border-radius:999px;overflow:hidden;font-size:12px;letter-spacing:.08em;margin-inline-start:24px}

nav .right{display:flex;align-items:center}
.film{position:relative;padding-top:clamp(70px,9vw,130px);padding-bottom:clamp(70px,9vw,130px)}
.film .frame{position:relative;aspect-ratio:16/9;max-width:100%;overflow:hidden;border-radius:var(--radius,0);box-shadow:0 50px 100px -40px rgba(0,0,0,.6);transform:perspective(1600px) rotateX(var(--frx,12deg)) scale(var(--fs,.9));transition:transform .2s linear}

.snd:hover{background:var(--accent);color:var(--ctaink,#111)}
.wall3d{padding-top:clamp(80px,10vw,150px);padding-bottom:clamp(80px,10vw,150px);overflow:hidden}
.wall3d .stage{perspective:1400px;margin-top:40px}
.wall3d .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;transform-style:preserve-3d;transform:rotateX(var(--wx,28deg)) rotateZ(var(--wz,-4deg)) translateZ(var(--wzz,-120px));transition:transform .15s linear}

[dir=rtl] .track,[dir=rtl] .marq,[dir=rtl] .strips,[dir=rtl] .wall3d .grid{direction:ltr}

  new THREE.TextureLoader().load(IMG([1,2,3,0][i%4]), tex => {
    R.setPhoto(tex); R.yaw = R.ty = -R.limitYaw; R.pitch = R.tp = 0; R.camera.fov = 30; R.t0 = performance.now(); R.open = true;
    $('roomt').textContent = CFG.projects[i][0]; $('roomtag').textContent = CFG.projects[i][1];
    $('room').classList.add('on'); if (lenis) lenis.stop(); document.body.style.overflow = 'hidden'; });
}
function exitRoom(){ $('room').classList.remove('on'); document.body.style.overflow = ''; if (lenis) lenis.start(); setTimeout(() => { if (R) R.open = false; }, 700); }
cards.forEach((c,i) => c.addEventListener('click', () => enterRoom(i)));
$('roomx').addEventListener('click', exitRoom);
addEventListener('keydown', e => { if (e.key === 'Escape') exitRoom(); });

/* ---------- preloader ---------- */
let n = 0, loaded = false; const ln = $('lnum');
const pre = new Image(); pre.onload = pre.onerror = () => loaded = true; pre.src = IMG(0);
const tick = setInterval(() => { n = Math.min(loaded ? 100 : 90, n + Math.ceil(Math.random()*8)); ln.textContent = n;
  if (n===100){ clearInterval(tick); setTimeout(()=>{ $('loader').classList.add('done'); document.body.classList.add('ready'); }, 250); } }, RM?1:40);
setTimeout(() => { loaded = true; }, 6000);
</script>

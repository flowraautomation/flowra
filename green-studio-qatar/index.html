<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Green Studio | Homes for Qatari families</title>
<meta name="description" content="168 villas designed under Qatar's housing-loan programme, from first sketch to supervision on site.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600&family=Tajawal:wght@300;500;700&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<meta property="og:type" content="website">
<meta property="og:title" content="Green Studio | Homes for Qatari families">
<meta property="og:description" content="168 housing-loan villas since 2013. A website concept by Flowra.">
<meta property="og:image" content="https://flowraautomation.github.io/flowra/green-studio-qatar/img/0.jpg">
<meta property="og:url" content="https://flowraautomation.github.io/flowra/green-studio-qatar/">
<meta name="twitter:card" content="summary_large_image">
<style>
/* Shared engine. Each firm sets its own palette, faces and layout through :root{--bg:#f2ebdf;--bg2:#1f3a2c;--ink:#1d2a22;--ink2:#f2ebdf;--mute:#6c6b5e;--mute2:#b9c2a9;--line:rgba(31,58,44,.16);--accent:#2f6b4a;--card:#fbf7f0;--radius:18px;
  --display:Fraunces,Georgia,serif;--dispw:300;--serif2:Fraunces,Georgia,serif;--body:Inter,system-ui,sans-serif;--ar:Tajawal,"Geeza Pro",sans-serif;--navblend:normal;--ctaink:#f2ebdf;color-scheme:light}
  body nav{color:var(--ink)} body.flip nav{color:var(--ink2)} body.flip .steps div{background:#264635} below. */
:root{
  --gl:max(16px, env(safe-area-inset-left, 0px), min(4vw, 56px));
  --gr:max(16px, env(safe-area-inset-right, 0px), min(4vw, 56px));
  --ease:cubic-bezier(.22,1,.36,1); --ease-io:cubic-bezier(.65,0,.35,1);
}
:root{--bg:#f2ebdf;--bg2:#1f3a2c;--ink:#1d2a22;--ink2:#f2ebdf;--mute:#6c6b5e;--mute2:#b9c2a9;--line:rgba(31,58,44,.16);--accent:#2f6b4a;--card:#fbf7f0;--radius:18px;
  --display:Fraunces,Georgia,serif;--dispw:300;--serif2:Fraunces,Georgia,serif;--body:Inter,system-ui,sans-serif;--ar:Tajawal,"Geeza Pro",sans-serif;--navblend:normal;--ctaink:#f2ebdf;color-scheme:light}
  body nav{color:var(--ink)} body.flip nav{color:var(--ink2)} body.flip .steps div{background:#264635}
*{box-sizing:border-box;margin:0;padding:0}
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
body{background:var(--bg);color:var(--ink);font:var(--bodyw,300) 16px/1.6 var(--body);overflow-x:hidden;-webkit-font-smoothing:antialiased;transition:background .8s var(--ease),color .8s var(--ease)}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:1px solid var(--accent);outline-offset:4px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.ar{font-family:var(--ar);direction:rtl}
h1,h2,h3{text-wrap:balance;font-weight:inherit}
.disp{font-family:var(--display);font-weight:var(--dispw,400);letter-spacing:var(--dispt,-.01em);text-transform:var(--dispcase,none)}
.lbl{font-family:var(--mono,var(--body));font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--mute)}
.wrap{padding-left:var(--gl);padding-right:var(--gr)}
section{position:relative}
.pad{padding-top:clamp(88px,12vw,168px);padding-bottom:clamp(88px,12vw,168px)}
body.flip{background:var(--bg2);color:var(--ink2)}
body.flip .lbl{color:var(--mute2)}

/* loader */
.loader{position:fixed;inset:0;z-index:100;background:var(--loaderbg,var(--bg));color:var(--ink);display:flex;align-items:flex-end;justify-content:space-between;padding:40px var(--gr) 40px var(--gl);transition:clip-path 1.2s var(--ease-io)}
.loader.done{clip-path:inset(0 0 100% 0);pointer-events:none}
.loader .num{font-family:var(--display);font-size:clamp(64px,14vw,180px);line-height:.8;font-variant-numeric:tabular-nums}

/* nav */
nav{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:calc(20px + env(safe-area-inset-top, 0px)) var(--gr) 20px var(--gl);mix-blend-mode:var(--navblend,difference);color:#fff}
nav .logo{font-family:var(--display);font-size:18px;letter-spacing:.06em}
nav ul{display:flex;gap:28px;list-style:none;font-size:12px;letter-spacing:.16em;text-transform:uppercase}
nav ul a{position:relative}
nav ul a::after{content:"";position:absolute;left:0;bottom:-4px;height:1px;width:100%;background:currentColor;transform:scaleX(0);transform-origin:right;transition:transform .5s var(--ease)}
nav ul a:hover::after{transform:scaleX(1);transform-origin:left}

/* shared photo plate with 3D strip flip */
.plate{position:absolute;inset:0;overflow:hidden;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(1.06)}
.plate .kb{position:absolute;inset:0;animation:kb 14s ease-in-out infinite alternate}
.plate .img{position:absolute;inset:-6%;background-size:cover;background-position:center;filter:var(--imgfilter,none);transform:translate3d(var(--px,0),var(--py,0),0)}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.12) translate3d(-2%,-1.5%,0)}}
.strips{position:absolute;inset:0;display:flex;perspective:1800px;pointer-events:none;z-index:1}
.strip{position:relative;flex:1;overflow:hidden;transform-origin:left center;transform:rotateY(-100deg);opacity:0;backface-visibility:hidden}
.strip.go{animation:flip 1.25s var(--ease) forwards}
.strip i{position:absolute;top:-6%;bottom:-6%;background-size:cover;background-position:center;filter:var(--imgfilter,none)}
@keyframes flip{0%{transform:rotateY(-100deg);opacity:0;filter:brightness(2)}35%{opacity:1}100%{transform:rotateY(0);opacity:1;filter:brightness(1)}}
.intro3d{transform:rotateX(16deg) scale(1.18) translateY(4%);filter:blur(12px) brightness(.5);transition:transform 3s var(--ease),filter 2.2s var(--ease)}
.ready .intro3d{transform:none;filter:none}
.rise .w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.08em}
.rise .w>span{display:inline-block;transform:translateY(108%);transition:transform 1.4s var(--ease)}
.ready .rise .w>span{transform:none}
.fadeup{opacity:0;transform:translateY(18px);transition:1.2s var(--ease) .8s}
.ready .fadeup{opacity:1;transform:none}

/* hero: arch (palace) */
.h-arch{min-height:100svh;display:grid;grid-template-rows:auto 1fr;justify-items:center;text-align:center;padding-top:calc(110px + env(safe-area-inset-top,0px));perspective:1400px}
.h-arch .ttl{font-size:clamp(46px,8vw,128px);line-height:.95}
.h-arch .ttl-ar{font-size:clamp(26px,3.6vw,52px);line-height:1.5;color:var(--accent);margin-top:6px}
.h-arch .arch{position:relative;width:min(560px,78vw);aspect-ratio:3/4;margin-top:36px;border-radius:999px 999px 0 0;overflow:hidden;box-shadow:0 0 0 1px var(--accent),0 0 0 14px var(--bg),0 0 0 15px color-mix(in srgb,var(--accent) 45%,transparent)}
.h-arch .side{position:absolute;top:48%;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--mute);writing-mode:vertical-rl}
.h-arch .side.l{left:var(--gl)} .h-arch .side.r{right:var(--gr)}

/* hero: split (swiss) */
.h-split{min-height:100svh;display:grid;grid-template-columns:1fr 1fr;padding-top:calc(90px + env(safe-area-inset-top,0px));perspective:1400px}
.h-split .txt{display:flex;flex-direction:column;justify-content:space-between;padding:24px var(--gl) 0 var(--gl);gap:40px}
.h-split .txt p.big{font-size:clamp(26px,2.6vw,40px);line-height:1.15;max-width:18ch}
.h-split .pic{position:relative;margin:0 var(--gr) 0 0;min-height:70svh}
.h-split .mark{grid-column:1/-1;font-size:clamp(90px,22vw,360px);line-height:.78;padding:0 var(--gr) 0 var(--gl);margin-top:-.08em;white-space:nowrap;overflow:hidden}

/* hero: blueprint (engineering) */
.h-blue{height:100svh;position:relative;overflow:hidden;perspective:1400px}
.h-blue .grid{position:absolute;inset:0;z-index:2;pointer-events:none;background-image:linear-gradient(var(--gridc) 1px,transparent 1px),linear-gradient(90deg,var(--gridc) 1px,transparent 1px);background-size:64px 64px}
.h-blue .shade{position:absolute;inset:0;z-index:2;background:linear-gradient(90deg,var(--bg) 0%,color-mix(in srgb,var(--bg) 70%,transparent) 45%,transparent 75%)}
.h-blue .cx,.h-blue .cy{position:absolute;z-index:3;background:var(--accent);opacity:.55;pointer-events:none}
.h-blue .cx{left:0;right:0;height:1px} .h-blue .cy{top:0;bottom:0;width:1px}
.h-blue .coord{position:absolute;z-index:3;font-family:var(--mono);font-size:11px;color:var(--accent);transform:translate(12px,12px);white-space:nowrap}
.h-blue .copy{position:absolute;z-index:4;left:var(--gl);right:var(--gr);bottom:max(72px,10vh)}
.h-blue h1{font-size:clamp(54px,9vw,150px);line-height:.88;max-width:12ch}
.h-blue .row{display:flex;gap:16px 48px;flex-wrap:wrap;margin-top:28px;align-items:flex-end}
.h-blue .row p{max-width:42ch;color:var(--mute)}

/* hero: type (brutalist) */
.h-type{min-height:100svh;padding-top:calc(96px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;justify-content:center;overflow:hidden;position:relative}
.h-type .line{font-size:clamp(70px,17vw,300px);line-height:.82;white-space:nowrap;padding:0 var(--gr) 0 var(--gl)}
.h-type .line.o{color:transparent;-webkit-text-stroke:1.5px var(--ink)}
.h-type .win{position:relative;height:clamp(140px,26vh,280px);margin:12px var(--gr) 12px var(--gl);overflow:hidden;clip-path:inset(0 var(--wi,30%) 0 var(--wi,30%));transition:clip-path .2s linear}
.h-type .meta{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:24px var(--gr) 0 var(--gl)}

/* hero: bilingual (family) */
.h-bi{min-height:100svh;padding-top:calc(104px + env(safe-area-inset-top,0px));display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr;gap:0 4vw;perspective:1400px}
.h-bi .en{padding-left:var(--gl)} .h-bi .arr{padding-right:var(--gr);text-align:right}
.h-bi h1{font-size:clamp(40px,6.2vw,104px);line-height:.95}
.h-bi .arr h1{font-family:var(--ar);line-height:1.35;font-size:clamp(34px,5vw,84px)}
.h-bi p{margin-top:18px;max-width:40ch;color:var(--mute)} .h-bi .arr p{margin-left:auto}
.h-bi .pic{grid-column:1/-1;position:relative;margin:40px var(--gr) 0 var(--gl);min-height:46svh;border-radius:var(--radius,0)}
.h-bi .badge{position:absolute;z-index:3;right:24px;top:24px;background:var(--bg);color:var(--ink);padding:14px 18px;border-radius:999px;font-size:13px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.15)}
.h-bi .badge b{font-family:var(--display);font-size:22px;color:var(--accent)}

/* hero: collage (avant-garde) */
.h-col{height:100svh;position:relative;overflow:hidden}
.h-col .word{position:absolute;left:var(--gl);right:var(--gr);top:50%;transform:translateY(-50%);font-size:clamp(110px,27vw,460px);line-height:.8;z-index:2;mix-blend-mode:var(--wordblend,normal);pointer-events:none}
.h-col .fl{position:absolute;overflow:hidden;box-shadow:0 30px 70px -20px rgba(0,0,0,.6);transform:translate3d(var(--fx,0),var(--fy,0),0) rotate(var(--fr,0deg))}
.h-col .fl .img{position:absolute;inset:-8%;background-size:cover;background-position:center}
.h-col .f1{width:min(30vw,420px);aspect-ratio:3/4;left:8vw;top:14vh;z-index:1}
.h-col .f2{width:min(34vw,500px);aspect-ratio:4/3;right:7vw;top:22vh;z-index:3}
.h-col .f3{width:min(20vw,280px);aspect-ratio:1;left:42vw;bottom:9vh;z-index:3}
.h-col .man{position:absolute;z-index:4;left:var(--gl);bottom:calc(60px + env(safe-area-inset-bottom,0px));max-width:34ch;font-size:15px}
.h-col .man em{font-family:var(--serif2);font-size:1.5em;font-style:italic;color:var(--accent)}

/* marquee */
.marq{overflow:hidden;white-space:nowrap;padding:22px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.marq .tr{display:inline-flex;gap:0;will-change:transform}
.marq span{font-size:clamp(44px,8vw,130px);line-height:1;padding-right:.5em}
.marq span:nth-child(even){color:transparent;-webkit-text-stroke:1px var(--accent)}
.marq span i{font-style:normal;color:var(--accent);padding:0 .3em}

/* statement + stats */
.stmt{font-size:clamp(30px,4.4vw,66px);line-height:1.1;max-width:24ch}
.stmt em{color:var(--accent);font-style:italic;font-family:var(--serif2,var(--display))}
.rl{display:block;overflow:hidden}.rl>span{display:block;transform:translateY(40%);opacity:0;transition:transform 1.2s var(--ease),opacity 1.2s var(--ease)}
.in .rl>span{transform:none;opacity:1}
.in .rl:nth-child(2)>span{transition-delay:.08s}.in .rl:nth-child(3)>span{transition-delay:.16s}.in .rl:nth-child(4)>span{transition-delay:.24s}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-top:80px;border-top:1px solid var(--line)}
.stat{padding:26px 0;border-bottom:1px solid var(--line)}
.stat b{display:block;font-family:var(--display);font-weight:var(--dispw,400);font-size:clamp(48px,5.6vw,84px);line-height:1;font-variant-numeric:tabular-nums}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:48px}

/* project index with cursor image */
.idx{list-style:none}
.idx li{display:grid;grid-template-columns:56px 1fr auto;gap:20px;align-items:baseline;padding:18px 0;border-bottom:1px solid var(--line);cursor:pointer;transition:padding .5s var(--ease),color .4s}
.idx li .n{font-family:var(--mono,var(--body));font-size:11px;color:var(--mute)}
.idx li .t{font-family:var(--display);font-weight:var(--dispw,400);font-size:clamp(26px,3.4vw,50px);line-height:1.05;text-transform:var(--dispcase,none)}
.idx li .m{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);text-align:right}
.idx li:hover{padding-left:18px;color:var(--accent)}
.idx.wall{display:flex;flex-wrap:wrap;gap:.1em .5em;border:0}
.idx.wall li{display:inline;border:0;padding:0}
.idx.wall li .n,.idx.wall li .m{display:none}
.idx.wall li .t{font-size:clamp(28px,4.4vw,70px)}
.idx.wall li:nth-child(3n+2) .t{color:transparent;-webkit-text-stroke:1px currentColor}
.idx.wall li:hover{padding-left:0}
.idx.wall li:hover .t{color:var(--accent);-webkit-text-stroke:0}
.peek{position:fixed;z-index:45;left:0;top:0;width:320px;aspect-ratio:4/5;pointer-events:none;overflow:hidden;opacity:0;transform:translate3d(var(--x,0),var(--y,0),0) translate(-50%,-50%) scale(.7) rotate(var(--r,0deg));transition:opacity .35s var(--ease),transform .5s var(--ease)}
.peek.on{opacity:1;transform:translate3d(var(--x,0),var(--y,0),0) translate(-50%,-50%) scale(1) rotate(var(--r,0deg))}
.peek div{position:absolute;inset:0;background-size:cover;background-position:center;filter:var(--imgfilter,none)}

/* 3D gallery */
.gal{height:300vh}
.gal .stick{position:sticky;top:0;height:100svh;overflow:hidden;display:flex;flex-direction:column;justify-content:center;perspective:1600px}
.gal .ghead{position:absolute;top:calc(88px + env(safe-area-inset-top,0px));left:var(--gl);right:var(--gr)}
.track{display:flex;gap:4vw;padding-left:var(--gl);transform-style:preserve-3d;will-change:transform}
.card{flex:0 0 min(60vw,840px);aspect-ratio:16/10;max-width:100%;position:relative;transform-style:preserve-3d;cursor:pointer}
.card .ph{position:absolute;inset:0;overflow:hidden;border-radius:var(--radius,2px);box-shadow:0 40px 80px -30px rgba(0,0,0,.7)}
.card .pi{position:absolute;inset:0 -10%;background-size:cover;background-position:center;filter:var(--imgfilter,none);transform:translate3d(var(--ix,0),0,0) scale(var(--is,1.05))}
.card .ph::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(105deg,transparent 35%,rgba(255,240,220,.22) 50%,transparent 65%);background-size:300% 100%;background-position:var(--cg,50%) 0;mix-blend-mode:screen}
.card .ph::after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,transparent 45%,rgba(8,7,6,.78))}
.card .meta{position:absolute;z-index:2;left:24px;right:24px;bottom:20px;color:#f4efe8;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;transform:translateZ(40px)}
.card h3{font-family:var(--display);font-weight:var(--dispw,400);font-size:clamp(24px,3vw,44px);line-height:1;text-transform:var(--dispcase,none)}
.card .tag{font-size:11px;letter-spacing:.18em;text-transform:uppercase;opacity:.85;white-space:nowrap}
.card .enter{position:absolute;z-index:2;top:16px;right:18px;transform:translateZ(40px);font-size:11px;letter-spacing:.2em;text-transform:uppercase;padding:9px 14px;border:1px solid rgba(244,239,232,.6);border-radius:999px;color:#f4efe8;background:rgba(10,9,8,.35);backdrop-filter:blur(6px);transition:background .4s,color .4s}
.card:hover .enter{background:#f4efe8;color:#111}
.gal .bar{position:absolute;left:var(--gl);right:var(--gr);bottom:calc(56px + env(safe-area-inset-bottom,0px));height:1px;background:var(--line)}
.gal .bar i{position:absolute;inset:0;background:var(--accent);transform-origin:left;transform:scaleX(var(--gp,0))}

/* table (engineering) */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px}
.filters button{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:9px 14px;border:1px solid var(--line);border-radius:999px;color:var(--mute);transition:all .3s}
.filters button.on,.filters button:hover{border-color:var(--accent);color:var(--accent)}
.tbl{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;min-width:720px}
.tbl th{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);text-align:left;font-weight:400;padding:12px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:18px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.p{font-family:var(--display);font-weight:var(--dispw,500);font-size:22px;line-height:1.15;text-transform:var(--dispcase,none)}
.tbl td.v{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums;color:var(--accent);white-space:nowrap}
.tbl td.c{color:var(--mute);font-size:14px}
.tbl tr{transition:background .3s}.tbl tbody tr:hover{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.tbl tr.hide{display:none}

/* materials (palace) */
.mats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px}
.mat{aspect-ratio:3/4;position:relative;overflow:hidden;border-radius:999px 999px 0 0;transition:transform .7s var(--ease)}
.mat:hover{transform:translateY(-10px)}
.mat .sw{position:absolute;inset:0}
.mat span{position:absolute;left:0;right:0;bottom:18px;text-align:center;font-family:var(--display);font-size:20px;color:#1b1712;text-shadow:0 1px 0 rgba(255,255,255,.4)}
.crafts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1px;background:var(--line);margin-top:56px;border:1px solid var(--line)}
.crafts div{background:var(--bg);padding:28px}
.crafts h4{font-family:var(--display);font-size:24px;margin-bottom:8px;color:var(--accent)}
.crafts p{color:var(--mute);font-size:14.5px}

/* steps (family) */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;counter-reset:s}
.steps div{padding:28px 24px 36px;background:var(--card,transparent);border-radius:var(--radius,0);border:1px solid var(--line);position:relative;overflow:hidden}
.steps b{display:block;font-family:var(--display);font-size:56px;line-height:1;color:var(--accent)}
.steps h4{font-family:var(--display);font-size:24px;margin:14px 0 6px}
.steps p{color:var(--mute);font-size:14.5px}
.steps .ar{display:block;margin-top:10px;font-size:15px;color:var(--ink)}

/* plan drawing */
.plan svg{width:100%;height:auto;display:block}
.plan path,.plan rect,.plan line,.plan circle{fill:none;stroke:var(--accent);stroke-width:1.4;vector-effect:non-scaling-stroke}
.plan .thin{stroke:var(--mute);stroke-width:.7}
.plan text{fill:var(--mute);font-family:var(--mono,var(--body));font-size:11px;letter-spacing:.1em}

/* services */
.svc{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.svc div{background:var(--bg);padding:36px 26px 48px;transition:background .5s}
body.flip .svc div{background:var(--bg2)}
.svc div:hover{background:color-mix(in srgb,var(--accent) 7%,var(--bg))}
.svc i{font-style:normal;font-family:var(--mono,var(--body));font-size:11px;color:var(--accent);letter-spacing:.2em}
.svc h4{font-family:var(--display);font-weight:var(--dispw,400);font-size:28px;margin:16px 0 10px;line-height:1.1;text-transform:var(--dispcase,none)}
.svc p{color:var(--mute);font-size:14.5px;max-width:34ch}

/* band */
.band{position:relative;height:78svh;overflow:hidden}
.band .img{position:absolute;inset:-12% 0;background-size:cover;background-position:center;filter:var(--imgfilter,none);transform:translate3d(0,var(--by,0),0) scale(1.05)}
.band::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,9,8,.78),rgba(10,9,8,.08) 70%)}
.band blockquote{position:absolute;z-index:1;left:var(--gl);right:var(--gr);top:50%;transform:translateY(-50%);font-family:var(--serif2,var(--display));font-style:italic;font-size:clamp(28px,4vw,58px);line-height:1.1;max-width:18ch;color:#f4efe8}

/* contact */
.contact h2{font-size:clamp(56px,11vw,180px);line-height:.88}
.contact h2 em{color:var(--accent);font-family:var(--serif2,var(--display));font-style:italic}
.cta{display:inline-flex;align-items:center;gap:16px;margin-top:44px;padding:18px 30px;border:1px solid currentColor;border-radius:999px;font-size:13px;letter-spacing:.18em;text-transform:uppercase;position:relative;overflow:hidden;isolation:isolate;transition:color .6s var(--ease)}
.cta::before{content:"";position:absolute;inset:0;background:var(--accent);transform:translateY(101%);transition:transform .6s var(--ease);z-index:-1}
.cta:hover{color:var(--ctaink,#111)}.cta:hover::before{transform:none}
.foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:14px 32px;margin-top:88px;padding:24px 0 48px;border-top:1px solid var(--line);font-size:12.5px;color:var(--mute);user-select:text}
.concept{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(15,14,13,.9);backdrop-filter:blur(10px);font-size:11.5px;letter-spacing:.04em;color:#bdb6ab;padding:8px var(--gr) calc(8px + env(safe-area-inset-bottom,0px)) var(--gl);text-align:center}
.concept b{color:#fff;font-weight:500}
.fade{opacity:0;transform:translateY(24px);transition:1.1s var(--ease)}
.in .fade{opacity:1;transform:none}

/* immersive room */
.room{position:fixed;inset:0;z-index:90;background:#000;color:#f4efe8;opacity:0;pointer-events:none;transition:opacity .7s var(--ease)}
.room.on{opacity:1;pointer-events:auto}
.room canvas{display:block;width:100%;height:100%;cursor:grab}
.room::after{content:"";position:absolute;inset:auto 0 0 0;height:40%;background:linear-gradient(transparent,rgba(0,0,0,.7));pointer-events:none}
.room .hud{position:absolute;z-index:1;left:var(--gl);right:var(--gr);bottom:calc(40px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:flex-end;gap:16px;pointer-events:none}
.room h3{font-family:var(--display);font-size:clamp(34px,5vw,72px);line-height:1;text-transform:var(--dispcase,none)}
.room .hint{font-size:11px;letter-spacing:.24em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.room .hint b{display:inline-block;width:26px;height:26px;border:1px solid currentColor;border-radius:50%;position:relative}
.room .hint b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:currentColor;animation:drag 2.4s var(--ease-io) infinite}
@keyframes drag{0%,100%{transform:translateX(-6px)}50%{transform:translateX(6px)}}
.room .close{position:absolute;z-index:1;top:calc(20px + env(safe-area-inset-top,0px));right:var(--gr);width:48px;height:48px;border-radius:50%;border:1px solid rgba(244,239,232,.5);background:rgba(13,12,11,.4);font-size:20px}
.room .tag{position:absolute;z-index:1;top:calc(32px + env(safe-area-inset-top,0px));left:var(--gl);font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--accent)}

@media (max-width:820px){
  nav ul{display:none}
  .h-split,.h-bi{grid-template-columns:1fr}
  .h-split .pic{margin:0 var(--gr) 0 var(--gl);min-height:52svh}
  .h-bi .arr{text-align:right;padding-left:var(--gl);margin-top:28px}
  .card{flex-basis:78vw;aspect-ratio:3/4}
  .gal{height:260vh}
  .h-blue h1{font-size:clamp(48px,14vw,90px)}
  .h-col .word{font-size:23vw}
  .h-col .f1{top:12vh}.h-col .f2{top:30vh}.h-col .f3{bottom:20vh}
  .h-type .line{font-size:19vw}
  .mats{grid-template-columns:repeat(2,1fr)}
  .stats{grid-template-columns:repeat(2,1fr)}
  .card .meta{flex-direction:column;align-items:flex-start;gap:6px}
  .idx li{grid-template-columns:32px 1fr}.idx li .m{grid-column:2;text-align:left}
  .h-col .f1{width:46vw;left:4vw}.h-col .f2{width:52vw;right:4vw}.h-col .f3{width:34vw;left:30vw}
  .peek{display:none}
  .h-arch .side{display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01s!important;animation:none!important}.intro3d{transform:none;filter:none}}

<script>

const CFG = {"name": "Green Studio", "short": "Green Studio", "city": "Lusail, Qatar", "est": "Est. 2013", "eyebrow": "Architecture · Interiors · Supervision", "eyebrowAr": "تصميم معماري وداخلي وإشراف", "headline": ["Homes for", "Qatari families."], "headlineAr": "بيوت للعائلات القطرية", "tagline": "168 villas designed under Qatar's housing-loan programme, from first sketch to supervision on site.", "taglineAr": "١٦٨ فيلا ضمن برنامج قروض الإسكان، من أول رسمة إلى الإشراف في الموقع.", "badge": ["4.74", "rating from 17 reviews on QDB Binaa"], "statement": ["Since 2013, <em>168 families</em>", "have built their home", "with Green Studio."], "stats": [[168, "Housing-loan projects"], [13, "Years in Qatar"], [4.74, "Rating on QDB Binaa"]], "stepsTitle": "Your housing-loan villa, step by step", "stepsTitleAr": "فيلتك بقرض الإسكان خطوة بخطوة", "steps": [["Consultation", "We meet the family and study the plot.", "استشارة ودراسة الأرض"], ["Design", "Architecture and interiors drawn around how you live.", "التصميم المعماري والداخلي"], ["Approvals", "Drawings prepared for the housing programme and authorities.", "تجهيز المخططات والموافقات"], ["Supervision", "Our engineers on site until handover.", "الإشراف الهندسي حتى التسليم"]], "sections": ["hero-bi", "statement", "steps", {"t": "gallery", "id": "gallery", "title": "Step inside a family villa"}, "band", "services", "contact"], "projects": [["Family Villa", "Sample · Lusail"], ["Courtyard Majlis", "Sample · Doha"], ["Living & Dining", "Sample · Al Rayyan"], ["Garden & Pool", "Sample · Al Wakra"]], "services": [["Architectural Design", "Villas designed for Qatari family life and the housing programme."], ["Interior Design & Decoration", "Majlis, living and bedrooms finished in one plan."], ["Electrical Design", "Electrical design and consultancy in-house."], ["Project Supervision", "Engineering supervision on site to handover."]], "quote": "One home, one family, done properly.", "closing": "Let's design<br>your <em>family home.</em>", "whatsapp": "97466114416", "phone": "+974 6611 4416", "email": "M.ALREFAI@GREENSTUDIO.QA", "address": "Manarat Lusail, Office 1501, Street 321, Lusail", "nav": [["Process", "#process"], ["Villas", "#gallery"], ["Services", "#services"], ["Contact", "#contact"]], "flipAt": "process"};
const $ = id => document.getElementById(id);

/* ---------- build sections ---------- */
const S = {};
S['hero-arch'] = () => `<section class="h-arch" id="hero">

S['hero-split'] = () => `<section class="h-split" id="hero">

S['hero-blue'] = () => `<section class="h-blue" id="hero">
  <div class="intro3d" id="platebox" style="position:absolute;inset:0"><div class="plate" id="plate"><div class="kb"><div class="img" id="heroimg"></div></div><div class="strips" id="strips"></div></div></div>
  <div class="shade"></div><div class="grid"></div><div class="cx" id="cx"></div><div class="cy" id="cy"></div><div class="coord" id="coord"></div>

S['hero-type'] = () => `<section class="h-type" id="hero">

  <div class="win" id="win"><div class="plate" id="plate"><div class="kb"><div class="img" id="heroimg"></div></div><div class="strips" id="strips"></div></div></div>
  ${CFG.typeLines.slice(2).map((l,i)=>`<div class="line disp rise ${i%2?'o':''}" data-drift="${i%2?1:-1}">${words(l)}</div>`).join('')}
  <div class="meta"><span class="lbl fadeup">${CFG.eyebrow}</span><span class="lbl fadeup">${CFG.city}</span></div></section>`;
S['hero-bi'] = () => `<section class="h-bi" id="hero">
  <div class="en"><div class="lbl fadeup" style="color:var(--accent)">${CFG.eyebrow}</div><h1 class="disp rise" style="margin-top:18px">${CFG.headline.map(words).join('<br>')}</h1><p class="fadeup">${CFG.tagline}</p></div>

  <div class="pic intro3d" id="platebox" style="overflow:hidden"><div class="plate" id="plate"><div class="kb"><div class="img" id="heroimg"></div></div><div class="strips" id="strips"></div></div>
  ${CFG.badge?`<div class="badge"><b>${CFG.badge[0]}</b>${CFG.badge[1]}</div>`:''}</div></section>`;
S['hero-col'] = () => `<section class="h-col" id="hero">
  <div class="fl f1 intro3d" data-d="40"><div class="img" style="background-image:url(${IMG(1)})"></div></div>
  <div class="fl f2 intro3d" data-d="-70"><div class="img" style="background-image:url(${IMG(0)})"></div></div>

  <div class="word disp rise">${words(CFG.wordmark||CFG.short)}</div>

S['marquee'] = (o) => `<div class="marq" data-speed="${o.speed||1}"><div class="tr">${[0,1].map(()=>o.items.map(t=>`<span class="disp">${t}<i>✦</i></span>`).join('')).join('')}</div></div>`;
S['statement'] = () => `<section class="pad wrap block" id="studio"><div class="head"><span class="lbl">${CFG.labels?.studio||'The studio'}</span><span class="lbl">${CFG.est}</span></div>

S['index'] = (o) => `<section class="pad wrap block" id="work"><div class="head"><span class="lbl">${o.title||'Index of work'}</span><span class="lbl">${pad2(CFG.index.length)} projects</span></div>
  <ul class="idx ${o.wall?'wall':''}" id="idx">${CFG.index.map((p,i)=>`<li data-i="${i}"><span class="n">${pad2(i+1)}</span><span class="t">${p[0]}</span><span class="m">${p[1]||''}</span></li>`).join(o.wall?' ':'')}</ul>
  ${o.note?`<p class="lbl" style="margin-top:28px;letter-spacing:.1em;text-transform:none">${o.note}</p>`:''}</section>`;
S['gallery'] = (o) => `<section class="gal" id="${o.id||'gallery'}"><div class="stick"><div class="ghead"><div class="head" style="margin:0"><span class="lbl">${o.title||'Step inside'}</span><span class="lbl">Tap a project to enter</span></div></div>
  <div class="track" id="track">${CFG.projects.map((p,i)=>`<article class="card"><div class="ph"><div class="pi" style="background-image:url(${IMG([1,2,3,0][i%4])})"></div></div><span class="enter">Enter ↗</span><div class="meta"><h3>${p[0]}</h3><span class="tag">${p[1]}</span></div></article>`).join('')}</div>
  <div class="bar"><i id="gbar"></i></div></div></section>`;
S['table'] = () => { const secs = [...new Set(CFG.table.map(r=>r[1]))];
  return `<section class="pad wrap block" id="work"><div class="head"><span class="lbl">Project register</span><span class="lbl">${CFG.table.length} projects · KD values as published</span></div>

S['materials'] = () => `<section class="pad wrap block" id="craft"><div class="head"><span class="lbl">The Abu Dhabi Palace · Materials</span><span class="lbl ar" style="letter-spacing:0">المواد</span></div>

S['plan'] = (o) => `<section class="pad wrap block plan" id="plan"><div class="head"><span class="lbl">${o.title}</span><span class="lbl">${o.sub||''}</span></div><div id="plansvg"></div></section>`;

$('top').innerHTML = CFG.sections.map(s => typeof s === 'string' ? S[s]({}) : S[s.t](s)).join('');
$('lname').textContent = CFG.name; $('logo').textContent = CFG.short; $('cfirm').textContent = CFG.name;
$('navl').innerHTML = (CFG.nav||[['Work','#work'],['Studio','#studio'],['Services','#services'],['Contact','#contact']]).map(n=>`<li><a href="${n[1]}">${n[0]}</a></li>`).join('');
document.querySelectorAll('[data-flip]').forEach(()=>{});

/* ---------- smooth scroll ---------- */
let lenis = null;
if (window.Lenis && !RM) { lenis = new Lenis({lerp:.085, smoothWheel:true}); window.lenis = lenis; }
document.querySelectorAll('a[href^="#"]').forEach(a => a.addEventListener('click', e => { const t = document.querySelector(a.getAttribute('href')); if (t && lenis) { e.preventDefault(); lenis.scrollTo(t); } }));

/* ---------- reveals + counters ---------- */
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); if (e.target.querySelector('.stat')) countUp(e.target); } }), {threshold:.12});
document.querySelectorAll('.block').forEach(b => io.observe(b));
setTimeout(() => document.querySelectorAll('.block').forEach(b => b.classList.add('in')), 6000);
function countUp(root){
  root.querySelectorAll('.stat b').forEach(el => {
    const to = +el.dataset.to, suf = el.dataset.suf, pre = el.dataset.pre, dec = (el.dataset.to.split('.')[1]||'').length, t0 = performance.now(), from = to > 1900 && to < 2100 ? to - 30 : 0;
    const step = t => { const k = Math.min(1,(t-t0)/1800), e = 1-Math.pow(1-k,4); el.textContent = pre + (from + (to-from)*e).toFixed(dec) + (k===1?suf:''); if(k<1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}

/* ---------- hero slideshow (3D strip flip) ---------- */
const heroimg = $('heroimg'), plate = $('plate');
if (heroimg) heroimg.style.backgroundImage = `url(${IMG(0)})`;
let cur = 0;
function nextSlide(){
  if (!heroimg) return;
  const nx = (cur + 1) % 4, st = $('strips'), NS = innerWidth < 760 ? 6 : 9;
  st.innerHTML = Array.from({length:NS}, (_,k) => `<div class="strip"><i style="left:${-k*100}%;width:${NS*100}%;background-image:url(${IMG(nx)})"></i></div>`).join('');
  [...st.children].forEach((el,k) => setTimeout(() => el.classList.add('go'), k*70));
  setTimeout(() => { heroimg.style.backgroundImage = `url(${IMG(nx)})`; st.innerHTML = ''; }, NS*70 + 1300);
  cur = nx;
}
[0,1,2,3].forEach(i => { const im = new Image(); im.src = IMG(i); });
if (!RM && heroimg) setTimeout(() => setInterval(nextSlide, 5500), 3200);

/* ---------- plan drawing ---------- */
if ($('plansvg')) {
  const P = [];
  const r = (x,y,w,h,c='') => P.push(`<rect class="${c}" x="${x}" y="${y}" width="${w}" height="${h}"/>`);
  const l = (x1,y1,x2,y2,c='') => P.push(`<line class="${c}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`);
  const t = (x,y,s) => P.push(`<text x="${x}" y="${y}">${s}</text>`);
  r(40,40,1120,520); r(60,60,500,300); r(560,60,580,180); r(560,240,300,300); r(860,240,280,300); r(60,360,500,180);
  for (let i=0;i<9;i++) l(80+i*52,80,80+i*52,340,'thin');
  P.push('<path d="M560 160 A80 80 0 0 1 640 240"/><path d="M860 400 A60 60 0 0 0 920 460"/><circle cx="310" cy="450" r="60"/>');
  r(620,300,180,120,'thin'); r(900,280,200,90,'thin');
  l(40,600,1160,600,'thin'); for (let i=0;i<=8;i++) l(40+i*140,592,40+i*140,608,'thin');
  (CFG.planLabels||['MAJLIS','COURTYARD','LIVING','KITCHEN','MASTER','POOL']).forEach((s,i)=>{ const pos=[[90,90],[580,90],[580,270],[880,270],[90,390],[260,540]][i]; t(pos[0],pos[1],s); });
  t(40,628,'0'); t(1130,628,'24 M');
  $('plansvg').innerHTML = `<svg viewBox="0 0 1200 640" role="img" aria-label="Plan drawing">${P.join('')}</svg>`;
  $('plansvg').querySelectorAll('rect,line,path,circle').forEach(el => { const L = el.getTotalLength ? el.getTotalLength() : 2000; el.style.strokeDasharray = L; el.style.strokeDashoffset = L; el.dataset.len = L; });
}

/* ---------- table filters ---------- */
if ($('filters')) $('filters').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return;
  $('filters').querySelectorAll('button').forEach(x => x.classList.toggle('on', x===b));
  $('tbody').querySelectorAll('tr').forEach(tr => tr.classList.toggle('hide', b.dataset.f !== '*' && tr.dataset.s !== b.dataset.f)); });

/* ---------- cursor image peek ---------- */
const peek = $('peek'), peekimg = $('peekimg');
let pxv = 0, pyv = 0, ptx = 0, pty = 0;
document.querySelectorAll('#idx li, #tbody tr').forEach(li => {
  li.addEventListener('pointerenter', () => { peekimg.style.backgroundImage = `url(${IMG((+li.dataset.i) % 4)})`; peek.classList.add('on'); });
  li.addEventListener('pointerleave', () => peek.classList.remove('on'));
});

/* ---------- marquees ---------- */
const marqs = [...document.querySelectorAll('.marq')].map((m,i) => ({el:m.firstElementChild, x:0, dir: i%2 ? 1 : -1, sp:+m.dataset.speed}));

/* ---------- motion loop ---------- */
let mx=0,my=0,sx=0,sy=0,lastMove=-1e9,lastY=scrollY,vel=0,cx=innerWidth/2,cy=innerHeight/2;
addEventListener('pointermove', e => { mx = e.clientX/innerWidth-.5; my = e.clientY/innerHeight-.5; cx=e.clientX; cy=e.clientY; lastMove = performance.now(); }, {passive:true});
const track = $('track'), cards = track ? [...track.children] : [], gal = track ? track.closest('.gal') : null;
const clamp = (v,a=0,b=1) => Math.min(b,Math.max(a,v));
function frame(now){
  if (lenis) lenis.raf(now);
  const H = innerHeight, W = innerWidth;
  if (now - lastMove > 2500) { mx = Math.sin(now/3200)*.35; my = Math.cos(now/4100)*.22; }
  sx += (mx-sx)*.05; sy += (my-sy)*.05;
  vel += ((scrollY - lastY) - vel) * .1; lastY = scrollY;
  if (plate && !RM) { plate.style.setProperty('--ry', (sx*6) + 'deg'); plate.style.setProperty('--rx', (-sy*4) + 'deg'); heroimg.style.setProperty('--px', (-sx*22)+'px'); heroimg.style.setProperty('--py', (-sy*14)+'px'); }
  // collage depth
  document.querySelectorAll('.h-col .fl').forEach(f => { const d = +f.dataset.d; f.style.setProperty('--fx', (sx*d*.6)+'px'); f.style.setProperty('--fy', (sy*d*.5 - scrollY*d/400)+'px'); f.style.setProperty('--fr', (sx*d/30)+'deg'); });
  // type hero: lines drift, window opens
  document.querySelectorAll('.h-type .line').forEach(ln => ln.style.transform = `translate3d(${(+ln.dataset.drift)*scrollY*.35}px,0,0)`);
  const win = $('win'); if (win) win.style.setProperty('--wi', Math.max(0, 30 - scrollY/H*60) + '%');
  // blueprint crosshair
  if ($('cx')) { $('cx').style.top = cy+'px'; $('cy').style.left = cx+'px'; const c=$('coord'); c.style.left=cx+'px'; c.style.top=cy+'px'; c.textContent = `X ${String(Math.round(cx*12.5)).padStart(5,'0')}  Y ${String(Math.round(cy*12.5)).padStart(5,'0')}  mm`; }
  // marquees respond to scroll speed
  marqs.forEach(m => { m.x += (0.6 + Math.abs(vel)*.25) * m.dir * m.sp; const w = m.el.scrollWidth/2; if (m.x < -w) m.x += w; if (m.x > 0) m.x -= w; m.el.style.transform = `translate3d(${m.x}px,0,0)`; });
  // gallery
  if (gal) { const gr = gal.getBoundingClientRect(), gp = clamp(-gr.top / (gal.offsetHeight - H)); const travel = Math.max(0, track.scrollWidth - W + W*.1);
    track.style.transform = `translate3d(${-gp*travel}px,0,0)`; $('gbar').style.setProperty('--gp', gp);
    cards.forEach(c => { const r = c.getBoundingClientRect(); const d = clamp(((r.left + r.width/2) - W/2) / W, -1, 1); if (RM) return;
      c.style.transform = `rotateY(${-d*24}deg) translateZ(${-Math.abs(d)*180}px) scale(${1-Math.abs(d)*.06})`;
      const ph = c.firstElementChild; ph.style.setProperty('--cg', (50 + d*120) + '%'); ph.firstElementChild.style.setProperty('--ix', (d*-7)+'%'); ph.firstElementChild.style.setProperty('--is', 1.05 + Math.abs(d)*.08); }); }
  // plan draws with scroll
  const pl = $('plansvg'); if (pl) { const r = pl.getBoundingClientRect(); const p = clamp((H - r.top) / (H*0.9 + r.height*0.5)); pl.querySelectorAll('rect,line,path,circle').forEach((el,i) => { const L = +el.dataset.len; const k = clamp(p*1.6 - i*0.025); el.style.strokeDashoffset = L*(1-k); }); }
  // band parallax
  const band = $('band'); if (band && !RM) { const br = band.getBoundingClientRect(); if (br.bottom > 0 && br.top < H) $('bandimg').style.setProperty('--by', ((br.top + br.height/2 - H/2) * -.18)+'px'); }
  // section colour flip
  const fl = document.querySelector('[data-flipzone]') || document.getElementById(CFG.flipAt||'__none');
  if (fl) { const r = fl.getBoundingClientRect(); document.body.classList.toggle('flip', r.top < H*.5 && r.bottom > H*.5); }
  // cursor peek
  ptx += (cx - ptx)*.15; pty += (cy - pty)*.15; peek.style.setProperty('--x', ptx+'px'); peek.style.setProperty('--y', pty+'px'); peek.style.setProperty('--r', (cx-ptx)*.05+'deg');
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- immersive room ---------- */
let R = null;
function loadThree(){ return window.THREE ? Promise.resolve() : new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js'; sc.onload = res; sc.onerror = rej; document.head.appendChild(sc); }); }
function buildRoom(){
  const canvas = $('roomc'), renderer = new THREE.WebGLRenderer({canvas, antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.outputEncoding = THREE.sRGBEncoding;
  const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(60, 1, .1, 400);
  const radius = 10, theta = 2.3, mat = new THREE.MeshBasicMaterial({side:THREE.BackSide, transparent:true, opacity:0});
  let mesh = null;
  const setPhoto = tex => { const h = radius*theta/(tex.image.width/tex.image.height);
    if (mesh) { scene.remove(mesh); mesh.geometry.dispose(); }
    mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, h, 96, 1, true, Math.PI - theta/2, theta), mat);
    tex.wrapS = THREE.RepeatWrapping; tex.repeat.x = -1; tex.offset.x = 1; tex.encoding = THREE.sRGBEncoding; tex.anisotropy = 8;
    mat.map = tex; mat.needsUpdate = true; scene.add(mesh); R.limitYaw = theta/2 - .55; R.limitPitch = Math.max(.05, Math.atan((h/2)/radius) - .5); };
  const N = 700, pos = new Float32Array(N*3);
  for (let i=0;i<N;i++){ const a = Math.PI + (Math.random()-.5)*2.4, rr = 2 + Math.random()*7; pos[i*3] = Math.sin(a)*rr; pos[i*3+1] = (Math.random()-.5)*7; pos[i*3+2] = Math.cos(a)*rr; }
  const pg = new THREE.BufferGeometry(); pg.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const dust = new THREE.Points(pg, new THREE.PointsMaterial({color:0xffe6c4, size:.035, transparent:true, opacity:.55, depthWrite:false})); scene.add(dust);
  R = {renderer, scene, camera, mat, setPhoto, yaw:0, pitch:0, ty:0, tp:0, t0:0, open:false, dragging:false, limitYaw:.6, limitPitch:.1, lastDrag:0};
  const resize = () => { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); };
  addEventListener('resize', resize); resize();
  let px = 0, py = 0;
  canvas.addEventListener('pointerdown', e => { R.dragging = true; px = e.clientX; py = e.clientY; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', e => { if (!R.dragging) return; R.ty += (e.clientX - px) * .0035; R.tp += (e.clientY - py) * .0025; px = e.clientX; py = e.clientY; R.lastDrag = performance.now(); });
  canvas.addEventListener('pointerup', () => R.dragging = false);
  canvas.addEventListener('wheel', e => { e.preventDefault(); camera.fov = Math.min(75, Math.max(35, camera.fov + e.deltaY*.03)); camera.updateProjectionMatrix(); }, {passive:false});
  const loop = now => { if (R.open) {
      const k = Math.min(1, (now - R.t0) / 2200), e = 1 - Math.pow(1-k, 3);
      if (!R.dragging && now - R.lastDrag > 2500) R.ty = Math.sin(now/5200) * R.limitYaw * .8;
      R.ty = clamp(R.ty, -R.limitYaw, R.limitYaw); R.tp = clamp(R.tp, -R.limitPitch, R.limitPitch);
      R.yaw += (R.ty - R.yaw) * .06; R.pitch += (R.tp - R.pitch) * .06;
      camera.position.set(0, 0, 26 * (1 - e)); camera.rotation.order = 'YXZ'; camera.rotation.set(-R.pitch, -R.yaw, 0);
      if (k < 1) { camera.fov = 30 + 30*e; camera.updateProjectionMatrix(); }
      mat.opacity = Math.min(1, k*2); dust.rotation.y = now/40000; renderer.render(scene, camera); }
    requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
async function enterRoom(i){
  try { await loadThree(); } catch(e) { return; }
  if (!R) buildRoom();
  new THREE.TextureLoader().load(IMG([1,2,3,0][i%4]), tex => {
    R.setPhoto(tex); R.yaw = R.ty = -R.limitYaw; R.pitch = R.tp = 0; R.camera.fov = 30; R.t0 = performance.now(); R.open = true;
    $('roomt').textContent = CFG.projects[i][0]; $('roomtag').textContent = CFG.projects[i][1];
    $('room').classList.add('on'); if (lenis) lenis.stop(); document.body.style.overflow = 'hidden'; });
}
function exitRoom(){ $('room').classList.remove('on'); document.body.style.overflow = ''; if (lenis) lenis.start(); setTimeout(() => { if (R) R.open = false; }, 700); }
cards.forEach((c,i) => c.addEventListener('click', () => enterRoom(i)));
$('roomx').addEventListener('click', exitRoom);
addEventListener('keydown', e => { if (e.key === 'Escape') exitRoom(); });

/* ---------- preloader ---------- */
let n = 0, loaded = false; const ln = $('lnum');
const pre = new Image(); pre.onload = pre.onerror = () => loaded = true; pre.src = IMG(0);
const tick = setInterval(() => { n = Math.min(loaded ? 100 : 90, n + Math.ceil(Math.random()*8)); ln.textContent = n;
  if (n===100){ clearInterval(tick); setTimeout(()=>{ $('loader').classList.add('done'); document.body.classList.add('ready'); }, 250); } }, RM?1:40);
setTimeout(() => { loaded = true; }, 6000);
</script>
